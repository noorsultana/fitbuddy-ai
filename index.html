<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Plan Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💪 FitBuddy</h1>
        <h2>AI Fitness Plan Generator</h2>

        <p class="intro">
            Create a personalized fitness plan based on your goals.
        </p>

        <form id="fitnessForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age" required>

            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter your weight" required>

            <label for="goal">Fitness Goal</label>
            <select id="goal" required>
                <option value="">Select your goal</option>
                <option value="General Fitness">General Fitness</option>
                <option value="Weight Loss">Weight Loss</option>
                <option value="Muscle Gain">Muscle Gain</option>
                <option value="Flexibility">Flexibility</option>
            </select>

            <label for="intensity">Workout Intensity</label>
            <select id="intensity" required>
                <option value="">Select intensity</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Generate My Plan</button>

        </form>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
